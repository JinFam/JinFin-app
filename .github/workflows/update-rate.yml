name: Update loan base rate

# SC제일은행 여신기준금리(금융채 6개월제)를 매 영업일 받아 rate.json 갱신.
# 값이 바뀔 때만 커밋한다. 실패하면 job 자체가 실패(조용한 정지 방지).

on:
  schedule:
    - cron: "0 15 * * 1-5"   # 월~금 10:30 KST
    - cron: "0 9 * * 1-5"    # 월~금 16:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-rate
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SC 금융채 6개월 기준금리
        run: |
          set -euo pipefail
          BASE_DT="$(date -u -d '+9 hours' +%Y%m%d)"   # 오늘(KST)
          echo "BASE_DT=$BASE_DT"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36'
          resp="$(curl -sS -m 60 -A "$UA" \
            -H 'Content-Type: application/json; charset=UTF-8' \
            -H 'X-Requested-With: XMLHttpRequest' \
            -H 'Referer: https://www.standardchartered.co.kr/np/kr/pl/et/StandardInterestRateP.jsp' \
            -X POST 'https://www.standardchartered.co.kr/np/kr/pl/et/selectLoanBaseRate' \
            --data "{\"serviceID\":\"HP_FP_PL_LoanBaseRate.selectLoanBaseRate\",\"task\":\"com.scfirstbank.web.fp.pl.task.HP_FP_PL_LoanBaseRateTask\",\"action\":\"selectLoanBaseRate\",\"BASE_DT\":\"$BASE_DT\",\"START_DATE\":\"\",\"END_DATE\":\"\"}")"

          # JSON인지 확인(Incapsula/차단 시 HTML이 오면 여기서 실패)
          if ! printf '%s' "$resp" | jq -e '.vector[0].LOAN_BASE' >/dev/null 2>&1; then
            echo "::error::응답이 예상 JSON이 아님(차단/구조변경 가능). 앞부분:"; printf '%s' "$resp" | head -c 300; echo; exit 1
          fi

          rate="$(printf '%s' "$resp" | jq -r '.vector[0].LOAN_BASE.FNANCL_BOND_6_MH_EXPIRE')"
          asof="$(printf '%s' "$resp" | jq -r '.vector[0].LOAN_BASE.BASE_DT')"
          echo "rate=$rate asOf=$asof"

          echo "$rate" | grep -Eq '^[0-9]+(\.[0-9]+)?$' || { echo "::error::금리 형식 이상: '$rate'"; exit 1; }
          echo "$asof" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::기준일 형식 이상: '$asof'"; exit 1; }

          jq -n --arg rate "$rate" --arg asof "$asof" \
            '{label:"금융채 6개월", rate:$rate, asOf:$asof, unit:"%", source:"SC제일은행 여신기준금리"}' \
            > rate.json.new

      - name: Commit if changed
        run: |
          set -euo pipefail
          if [ -f rate.json ] && cmp -s rate.json.new rate.json; then
            echo "변동 없음 — 커밋 생략"; rm -f rate.json.new; exit 0
          fi
          mv rate.json.new rate.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git commit -m "chore: 기준금리 갱신(금융채 6개월) [skip ci]"
          git push
